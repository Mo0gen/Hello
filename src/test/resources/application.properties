spring.application.name=Hello

# Base H2 en mémoire dédiée aux tests : indépendante de la base MySQL de développement,
# recréée à chaque exécution des tests (aucune donnée réelle n'est touchée).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Désactivé pendant les tests : on ne veut pas appeler la vraie API externe
# (geo.api.gouv.fr) ni réécrire application.properties à chaque exécution des tests.
application.init=false
